<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d13">
  <title>Autopilot v3 — центр керування</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand-block">
        <span class="eyebrow">AUTOPILOT V3</span>
        <h1>Центр керування</h1>
        <p id="updated" class="updated">Завантаження…</p>
      </div>
      <button id="refresh" class="icon-button" type="button" aria-label="Оновити статус">↻</button>
    </header>
    <section id="overview" class="overview-grid" aria-label="Огляд v3"></section>
    <section id="services" class="ai-card" aria-label="Інфраструктура v3"></section>
    <section id="projects" class="projects" aria-live="polite"></section>
    <p id="message" class="toast" role="status" aria-live="polite"></p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
