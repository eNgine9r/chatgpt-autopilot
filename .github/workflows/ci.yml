name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Policy tests
        run: npm test
      - name: JavaScript syntax checks
        run: npm run check
      - name: Shell syntax checks
        run: bash -n scripts/install.sh scripts/install-systemd.sh
      - name: Manifest JSON check
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
